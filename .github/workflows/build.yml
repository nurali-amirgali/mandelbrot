name: Build executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            fmt: zip
            onefile: "--onefile"
          - os: macos-latest
            name: macos
            fmt: gztar
            onefile: ""
          - os: ubuntu-22.04
            name: linux
            fmt: gztar
            onefile: "--onefile"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pygame numpy

      - name: Build with PyInstaller
        shell: bash
        run: pyinstaller --noconfirm --windowed ${{ matrix.onefile }} --name Mandelbrot main.py

      - name: Archive
        shell: bash
        run: |
          python -c "import shutil; shutil.make_archive('Mandelbrot-${{ matrix.name }}', '${{ matrix.fmt }}', 'dist')"

      - uses: actions/upload-artifact@v4
        with:
          name: Mandelbrot-${{ matrix.name }}
          path: Mandelbrot-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*